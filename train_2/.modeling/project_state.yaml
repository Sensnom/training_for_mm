  problem_2:
    requirement_status: confirmed
    requirement: 建立动力学模型并结合容积模型计算6000 r/min时最大输出功率，定量分析重叠角变化对发动机效率的影响
    model_name: 相似机型约束的开放系统热力--转矩耦合模型
    allowed_abbreviation: null
