  problem_1:
    requirement_status: confirmed
    requirement: 建立各缸容积随转角变化模型，计算排量与压缩比，并分析转子内圆直径在基准值正负10%范围变化时对压缩比的影响
    approved_modeling_assumptions:
      - id: q1_symmetric_circular_arc_rotor_sides
        status: confirmed_by_user
        statement: 转子三条侧边均连接相邻顶点、关于该边中线对称，并为在边中点与直径 d 的内切圆相切的劣圆弧。
        scope: 仅用于问题一的理想几何、容积、压缩比及 d 灵敏度计算；不作为正式附件对实际转子侧边形状的事实断言，也不外推为制造、热变形或密封模型。
        source: 用户明确批准，2026-08-13
    model_name: 圆弧转子--Green面积容积模型
    allowed_abbreviation: null
    algorithm_name: 解析边界积分与内圆直径参数扫描法
    official_results:
      scope: 仅适用于用户批准的“对称、边中点相切劣圆弧”理想几何；不作为实际CAD轮廓、制造、热变形或密封模型的结论
