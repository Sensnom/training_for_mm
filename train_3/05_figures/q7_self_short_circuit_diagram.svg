<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#111}
      .h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:19px}
      .box{fill:#fff;stroke:#333;stroke-width:3}.elec{fill:#e8e8e8;stroke:#111;stroke-width:2}
      .obj{fill:#b7d8ef;stroke:#222;stroke-width:2.5}.wrap{fill:#d5e9f6;stroke:#222;stroke-width:2.5;stroke-dasharray:8 5}
      .guide{stroke:#666;stroke-width:2;stroke-dasharray:7 6}.arr{stroke:#333;stroke-width:3;marker-end:url(#arrow)}
      .id{font-size:18px;font-weight:700}.accent{fill:#f6f6f6;stroke:#888;stroke-width:1.5}
    </style>
  </defs>
  <text x="700" y="48" text-anchor="middle" class="t h">真实越界回迁与同一 physical ID 自短路示意</text>

  <!-- Panel 1 -->
  <g transform="translate(55,95)">
    <text x="190" y="0" text-anchor="middle" class="t s">① 原始介质发生 +X 越界</text>
    <rect x="20" y="35" width="340" height="250" class="box"/>
    <rect x="20" y="35" width="15" height="250" class="elec"/><rect x="345" y="35" width="15" height="250" class="elec"/>
    <text x="8" y="310" class="t sm">左电极</text><text x="318" y="310" class="t sm">右电极</text>
    <line x1="350" y1="28" x2="350" y2="296" class="guide"/>
    <circle cx="330" cy="160" r="42" class="obj"/>
    <circle cx="378" cy="160" r="42" class="accent" opacity="0.55"/>
    <text x="330" y="166" text-anchor="middle" class="t id">Bᵢ</text>
    <text x="270" y="232" class="t sm">实体部分越过 x=+5000</text>
    <line x1="370" y1="250" x2="440" y2="250" class="arr"/>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(505,95)">
    <text x="190" y="0" text-anchor="middle" class="t s">② 越界部分平移 −L 回到相对侧</text>
    <rect x="20" y="35" width="340" height="250" class="box"/>
    <rect x="20" y="35" width="15" height="250" class="elec"/><rect x="345" y="35" width="15" height="250" class="elec"/>
    <circle cx="330" cy="160" r="42" class="obj"/>
    <circle cx="50" cy="160" r="42" class="wrap"/>
    <text x="330" y="166" text-anchor="middle" class="t id">Bᵢ</text><text x="50" y="166" text-anchor="middle" class="t id">Bᵢ</text>
    <line x1="310" y1="220" x2="84" y2="220" class="arr"/>
    <text x="197" y="248" text-anchor="middle" class="t sm">回迁位移：−10000 nm</text>
    <text x="190" y="315" text-anchor="middle" class="t sm">两段几何表示共享同一 physical ID=i</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(955,95)">
    <text x="190" y="0" text-anchor="middle" class="t s">③ 同一 ID 同时接触左右电极</text>
    <rect x="20" y="35" width="340" height="250" class="box"/>
    <rect x="20" y="35" width="15" height="250" class="elec"/><rect x="345" y="35" width="15" height="250" class="elec"/>
    <circle cx="52" cy="160" r="42" class="wrap"/><circle cx="328" cy="160" r="42" class="obj"/>
    <text x="52" y="166" text-anchor="middle" class="t id">Bᵢ</text><text x="328" y="166" text-anchor="middle" class="t id">Bᵢ</text>
    <line x1="35" y1="160" x2="10" y2="160" class="arr"/><line x1="345" y1="160" x2="375" y2="160" class="arr"/>
    <text x="190" y="225" text-anchor="middle" class="t s">E_L — Bᵢ — E_R</text>
    <text x="190" y="258" text-anchor="middle" class="t s" font-weight="700">判定：自短路 → 微构体导通</text>
  </g>

  <g transform="translate(70,505)">
    <rect x="0" y="0" width="1260" height="175" rx="12" class="accent"/>
    <text x="28" y="40" class="t s" font-weight="700">同样的 physical-ID 逻辑适用于介质 A：</text>
    <line x1="70" y1="98" x2="310" y2="98" stroke="#222" stroke-width="34" stroke-linecap="butt"/>
    <line x1="990" y1="98" x2="1190" y2="98" stroke="#222" stroke-width="34" stroke-linecap="butt"/>
    <text x="190" y="105" text-anchor="middle" class="t id" style="fill:#fff">Aᵢ 回迁片段</text>
    <text x="1090" y="105" text-anchor="middle" class="t id" style="fill:#fff">Aᵢ 原始片段</text>
    <text x="630" y="105" text-anchor="middle" class="t s">只有真实越界片段回迁；未越界的不同介质不做全局最小镜像接触</text>
    <text x="630" y="145" text-anchor="middle" class="t sm">L=10000 nm；左/右电极分别位于 x=−5000 与 x=+5000</text>
  </g>
</svg>
